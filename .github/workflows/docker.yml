name: Test and publish container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/dashboard.test.cjs
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read application version
        id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/jbat66/prusa-print-monitor
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.value }},enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test published container
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/jbat66/prusa-print-monitor:latest
          docker run --rm --entrypoint ffmpeg ghcr.io/jbat66/prusa-print-monitor:latest -f lavfi -i sine=frequency=880:duration=0.2 -c:a libmp3lame -f mp3 pipe:1 > "$RUNNER_TEMP/alert.mp3"
          docker run -d --name monitor-smoke -p 127.0.0.1:8085:8085 -e ALERT=true --mount type=bind,source="$RUNNER_TEMP/alert.mp3",target=/sounds,readonly ghcr.io/jbat66/prusa-print-monitor:latest
          trap 'docker logs monitor-smoke; docker rm -f monitor-smoke' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail http://127.0.0.1:8085/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8085/health
          curl --fail http://127.0.0.1:8085/api/status
          curl --fail -D "$RUNNER_TEMP/alert-headers" http://127.0.0.1:8085/alert -o "$RUNNER_TEMP/served-alert.mp3"
          cmp "$RUNNER_TEMP/alert.mp3" "$RUNNER_TEMP/served-alert.mp3"
          grep -i "Content-Type: audio/mpeg" "$RUNNER_TEMP/alert-headers"
          curl --fail http://127.0.0.1:8085/ | grep 'PRINT MONITOR'
          curl --fail http://127.0.0.1:8085/icon.png -o "$RUNNER_TEMP/icon.png"
          curl --fail http://127.0.0.1:8085/favicon.ico -o "$RUNNER_TEMP/favicon.ico"
          python -c "from pathlib import Path; assert Path('$RUNNER_TEMP/favicon.ico').read_bytes()[:6] == bytes([0,0,1,0,7,0])"
          python -c "from pathlib import Path; assert Path('$RUNNER_TEMP/icon.png').read_bytes().startswith(bytes([137,80,78,71,13,10,26,10]))"
          docker exec monitor-smoke ffmpeg -hide_banner -h muxer=mpjpeg 2>&1 | grep boundary_tag
          # A closed loopback port exercises the real RTSP input option parser.
          # The expected failure is connection refused, not an unknown option.
          docker exec monitor-smoke python -c "import subprocess; from app import camera_command; r=subprocess.run(camera_command('rtsp://127.0.0.1:1/live'),capture_output=True,timeout=5); error=r.stderr.decode(); print(error); assert 'Connection refused' in error; assert 'Option not found' not in error and 'Option rw_timeout not found' not in error"
          docker stop --time 5 monitor-smoke
          test "$(docker inspect --format '{{.State.ExitCode}}' monitor-smoke)" = "0"
